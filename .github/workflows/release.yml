name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Check out into a subdir so the package can be imported as "choices_viewer"
          path: choices_viewer

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r choices_viewer/requirements.txt
          pip install pyinstaller

      - name: Build Windows executable
        run: >
          pyinstaller
          --onefile
          --windowed
          --collect-all PyQt6
          --name choices-viewer
          choices_viewer/__main__.py

      - uses: actions/upload-artifact@v4
        with:
          name: choices-viewer-windows
          path: dist/choices-viewer.exe

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: choices_viewer

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system Qt/xcb dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libgl1 libglib2.0-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 \
            libxcb-render-util0 libxcb-xinerama0 libxkbcommon-x11-0

      - name: Install dependencies
        run: |
          pip install -r choices_viewer/requirements.txt
          pip install pyinstaller

      - name: Build Linux binary
        run: >
          pyinstaller
          --onefile
          --windowed
          --collect-all PyQt6
          --name choices-viewer-linux
          choices_viewer/__main__.py

      - uses: actions/upload-artifact@v4
        with:
          name: choices-viewer-linux
          path: dist/choices-viewer-linux

  release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: choices-viewer-windows

      - uses: actions/download-artifact@v4
        with:
          name: choices-viewer-linux

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            choices-viewer.exe
            choices-viewer-linux
