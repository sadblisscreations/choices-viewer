name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Check out into a subdir so the package is importable as "choices_viewer"
          path: choices_viewer

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r choices_viewer/requirements.txt
          pip install pyinstaller

      - name: Create entry point
        shell: bash
        run: |
          printf 'from choices_viewer.__main__ import main\nif __name__ == "__main__":\n    main()\n' > run.py

      - name: Convert icon PNG to ICO
        shell: python
        run: |
          from PIL import Image
          img = Image.open("choices_viewer/icon.png").convert("RGBA")
          sizes = [(256, 256), (128, 128), (64, 64), (48, 48), (32, 32), (16, 16)]
          resized = [img.resize(s, Image.LANCZOS) for s in sizes]
          resized[0].save(
              "choices_viewer/icon.ico",
              format="ICO",
              append_images=resized[1:],
              sizes=sizes,
          )
          print("ICO written OK")

      - name: Build Windows executable
        shell: bash
        run: |
          pyinstaller \
            --onefile \
            --windowed \
            --collect-all PyQt6 \
            --add-data "choices_viewer/icon.png;." \
            --icon "choices_viewer/icon.ico" \
            --name choices-viewer \
            run.py

      - uses: actions/upload-artifact@v4
        with:
          name: choices-viewer-windows
          path: dist/choices-viewer.exe

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: choices_viewer

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system Qt/xcb dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libgl1 libglib2.0-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 \
            libxcb-render-util0 libxcb-xinerama0 libxkbcommon-x11-0

      - name: Install dependencies
        run: |
          pip install -r choices_viewer/requirements.txt
          pip install pyinstaller

      - name: Create entry point
        run: |
          printf 'from choices_viewer.__main__ import main\nif __name__ == "__main__":\n    main()\n' > run.py

      - name: Build Linux binary
        run: |
          pyinstaller \
            --onefile \
            --windowed \
            --collect-all PyQt6 \
            --add-data "choices_viewer/icon.png:." \
            --name choices-viewer-linux \
            run.py

      - uses: actions/upload-artifact@v4
        with:
          name: choices-viewer-linux
          path: dist/choices-viewer-linux

  release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: choices-viewer-windows

      - uses: actions/download-artifact@v4
        with:
          name: choices-viewer-linux

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            choices-viewer.exe
            choices-viewer-linux
